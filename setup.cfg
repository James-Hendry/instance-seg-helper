[metadata]
name = instance-seg-helper
version = 0.2.0
author = James Hendry
classifiers =
    Framework :: napari

[options]
packages = find:
include_package_data = True
install_requires =
    napari
    numpy
    numba
    scikit-image

[options.package_data]
* = *.yaml

[options.entry_points]
napari.manifest =
    instance-seg-helper = instance_seg_helper:napari.yaml